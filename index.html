<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор устройства полов</title>
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .section-title {
            color: #26A69A;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2b2b2b;
            color: white;
            box-sizing: border-box;
        }
        .counter-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .counter-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-counter {
            width: 35px;
            height: 35px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
        }
        .counter-value {
            width: 80px;
            text-align: center;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            margin-bottom: 5px;
            user-select: none;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #26A69A;
        }
        .disabled-text {
            color: gray !important;
        }
        .btn-calculate {
            background-color: #2e7d32;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="section-title">Параметры пола (кликами)</div>
    
    <select id="mix_select">
        <option value="Самонивелир Ceresit DG (Наливной пол, 25 кг)">Самонивелир Ceresit DG</option>
        <option value="Ceresit CN 83 (Стяжка высокопрочная, 25 кг)">Ceresit CN 83</option>
        <option value="Тайфун Мастер № 44 PLUS (Стяжка, 25 кг)">Тайфун Мастер № 44 PLUS</option>
    </select>

    <div class="counter-group">
        <span>Длина Стены А (метры):</span>
        <div class="counter-controls">
            <button class="btn-counter" onclick="changeVal('wall_a', -0.1)">-</button>
            <input type="number" id="wall_a" class="counter-value" value="4.0" step="0.1">
            <button class="btn-counter" onclick="changeVal('wall_a', 0.1)">+</button>
        </div>
    </div>

    <div class="counter-group">
        <span>Длина Стены Б (метры):</span>
        <div class="counter-controls">
            <button class="btn-counter" onclick="changeVal('wall_b', -0.1)">-</button>
            <input type="number" id="wall_b" class="counter-value" value="3.0" step="0.1">
            <button class="btn-counter" onclick="changeVal('wall_b', 0.1)">+</button>
        </div>
    </div>

    <div class="counter-group">
        <span>Общая высота пола (мм):</span>
        <div class="counter-controls">
            <button class="btn-counter" onclick="changeVal('height', -5)">-</button>
            <input type="number" id="height" class="counter-value" value="80" step="5">
            <button class="btn-counter" onclick="changeVal('height', 5)">+</button>
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="penoplex_var" onchange="togglePenoplex()">
        <label for="penoplex_var">Использовать утеплитель (Пеноплекс)</label>
    </div>

    <div class="counter-group disabled-text" id="penoplex_row">
        <span>Толщина Пеноплекса (мм):</span>
        <div class="counter-controls">
            <button class="btn-counter" id="btn_p_minus" onclick="changeVal('penoplex_thick', -5)" disabled>-</button>
            <input type="number" id="penoplex_thick" class="counter-value" value="50" step="5" disabled>
            <button class="btn-counter" id="btn_p_plus" onclick="changeVal('penoplex_thick', 5)" disabled>+</button>
        </div>
    </div>

    <div>
        <div style="margin-bottom: 5px;">Стоимость мешка (руб):</div>
        <input type="number" id="price_bag" value="15.00">
    </div>

    <button class="btn-calculate" onclick="sendDataToBot()">Выдать Готовую Смету 🚀</button>

    <script>
        var tg = window.Telegram.WebApp;
        if (tg) { tg.expand(); }

        document.addEventListener("DOMContentLoaded", function() {
            if (tg) {
                tg.ready();
            }
        });

        function changeVal(id, amount) {
            var input = document.getElementById(id);
            var val = parseFloat(input.value) + amount;
            if (val < 0) val = 0;
            input.value = val.toFixed(id === 'wall_a' || id === 'wall_b' ? 1 : 0);
        }

        function togglePenoplex() {
            var isChecked = document.getElementById('penoplex_var').checked;
            var row = document.getElementById('penoplex_row');
            var thickInput = document.getElementById('penoplex_thick');
            var btnMinus = document.getElementById('btn_p_minus');
            var btnPlus = document.getElementById('btn_p_plus');

            if (isChecked) {
                row.classList.remove('disabled-text');
                thickInput.removeAttribute('disabled');
                btnMinus.removeAttribute('disabled');
                btnPlus.removeAttribute('disabled');
            } else {
                row.classList.add('disabled-text');
                thickInput.setAttribute('disabled', 'true');
                btnMinus.setAttribute('disabled', 'true');
                btnPlus.setAttribute('disabled', 'true');
            }
        }

        function sendDataToBot() {
            var usePenoplex = document.getElementById('penoplex_var').checked;
            
            var payload = [
                document.getElementById('mix_select').value.replace(/ /g, "x"),
                document.getElementById('wall_a').value,
                document.getElementById('wall_b').value,
                document.getElementById('height').value,
                usePenoplex ? "1" : "0",
                document.getElementById('penoplex_thick').value,
                document.getElementById('price_bag').value
            ];

            var dataString = payload.join("-");
            var botUser = "stroy_calc_vlad_bot";

            // ИСПРАВЛЕНО: Добавлен обязательный слеш "/" после t.me
            var targetLink = "https://t.me" + botUser + "?start=" + dataString;

            if (tg) {
                tg.openTelegramLink(targetLink);
                tg.close();
            } else {
                window.location.href = targetLink;
            }
        }
    </script>
</body>
</html>
